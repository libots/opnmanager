<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OPNmanager</title>
  <desc id="desc">Circular O enclosing a brick-pattern shield connected to three managed firewalls.</desc>
  <!-- Transparent background; status lights are holes, not white paint -->
  <mask id="lights">
    <rect width="256" height="256" fill="#fff"/>
    <g fill="#000">
      <circle cx="84" cy="185.5" r="2.3"/><circle cx="93" cy="185.5" r="2.3"/>
      <circle cx="124" cy="185.5" r="2.3"/><circle cx="133" cy="185.5" r="2.3"/>
      <circle cx="164" cy="185.5" r="2.3"/><circle cx="173" cy="185.5" r="2.3"/>
    </g>
  </mask>
  <g fill="none" stroke="#C03E14" stroke-linejoin="round">
    <circle cx="128" cy="128" r="106" stroke-width="20"/>
    <path d="M128 55 C143 66 160 72 174 73 L174 102 C174 125 158 143 128 157 C98 143 82 125 82 102 L82 73 C96 72 113 66 128 55 Z" stroke-width="11"/>
    <path d="M128 158 V165 M88 180 V165 H168 V180 M128 165 V180" stroke-width="6.5" stroke-linecap="round"/>
  </g>
  <!-- Firewall brickwork -->
  <g fill="#C03E14">
    <rect x="98" y="88" width="28" height="11" rx="1.3"/>
    <rect x="130" y="88" width="28" height="11" rx="1.3"/>
    <rect x="98" y="104" width="12" height="11" rx="1.3"/>
    <rect x="114" y="104" width="28" height="11" rx="1.3"/>
    <rect x="146" y="104" width="12" height="11" rx="1.3"/>
    <rect x="108" y="120" width="20" height="11" rx="1.3"/>
    <rect x="132" y="120" width="20" height="11" rx="1.3"/>
    <!-- Three managed devices, with status lights cut out -->
    <g mask="url(#lights)">
    <rect x="73" y="178" width="30" height="15" rx="3"/>
    <rect x="113" y="178" width="30" height="15" rx="3"/>
    <rect x="153" y="178" width="30" height="15" rx="3"/>
    </g>
  </g>
</svg>