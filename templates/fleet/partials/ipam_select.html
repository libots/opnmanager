{% if all_firewalls|length > 1 %}<details class="panel explainer ipam-select"><summary>Firewalls shown: {% for fw in firewalls %}{{ fw.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</summary><form method="get"><div data-selection-list>{% for fw in all_firewalls %}<label class="inline-check"><input type="checkbox" name="firewalls" value="{{ fw.pk }}" {% if fw in firewalls %}checked{% endif %}>{{ fw.name }}</label>{% endfor %}</div><button class="button">Compare selected</button></form></details>{% endif %}
